[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fulgur-search"
version = "1.0.0"
description = "Offline instant trie-based autocomplete search and local document viewer."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flet>=0.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.flet]
org = "org.fulgursearch"
product = "Fulgur Search"
company = "Fulgur Search"
copyright = "Offline local search"

[tool.flet.app]
path = "."

[tool.flet.android]
min_sdk_version = 26
target_sdk_version = 35
split_per_abi = true

[tool.flet.android.adaptive_icon_background]
color = "#2f6fed"
